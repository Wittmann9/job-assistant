name: Job assistant

on:
  schedule:
    - cron: "15 6-18/3 * * *"   # 06:15, 09:15, 12:15, 15:15, 18:15 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Score jobs but do not send Telegram messages"
        type: boolean
        default: false

concurrency:
  group: job-assistant
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Write profile
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
        run: printf '%s' "$PROFILE_YAML" > profile.yaml

      - name: Run assistant
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUIET: "1"
        run: python main.py --days 2 --max-alerts 10 ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}